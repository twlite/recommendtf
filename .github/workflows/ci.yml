name: CI and Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      is_release: ${{ steps.release.outputs.is_release }}
      version: ${{ steps.release.outputs.version }}
      npm_tag: ${{ steps.release.outputs.npm_tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Detect authorized release commit
        id: release
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: node .github/scripts/release.mjs detect

  test:
    needs: detect
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and run regression tests
        run: pnpm test

  pack:
    if: needs.detect.outputs.is_release == 'true'
    needs: [detect, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Apply version from release commit
        env:
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
        run: node .github/scripts/release.mjs sync "$RELEASE_VERSION"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build release
        run: pnpm build
      - name: Pack npm release artifact
        env:
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          mkdir -p release-artifacts
          pnpm pack --pack-destination release-artifacts
          node .github/scripts/release.mjs verify "release-artifacts/recommendtf-$RELEASE_VERSION.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: recommendtf-release-${{ github.sha }}
          path: release-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: needs.detect.outputs.is_release == 'true'
    needs: [detect, pack]
    runs-on: ubuntu-24.04
    concurrency:
      group: recommendtf-npm-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install npm CLI with trusted publishing support
        run: |
          npm install --global npm@11.21.0
          test "$(npm --version)" = "11.21.0"
      - uses: actions/download-artifact@v4
        with:
          name: recommendtf-release-${{ github.sha }}
          path: release-artifacts
      - name: Publish through GitHub OIDC (skip already-published versions)
        env:
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
          NPM_TAG: ${{ needs.detect.outputs.npm_tag }}
        run: node .github/scripts/release.mjs publish release-artifacts

  github-release:
    if: needs.detect.outputs.is_release == 'true'
    needs: [detect, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Create or reuse GitHub release after npm publication
        env:
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.mjs github-release
